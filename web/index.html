<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Robot Kinematics Simulator</title><style>body{margin:0;background:#0b1020;color:#e5e7eb;font-family:system-ui;text-align:center}canvas{background:#111827;border:1px solid #334155;max-width:95vw}.controls{margin:15px}button{padding:10px 16px;margin:4px;border:0;border-radius:8px;cursor:pointer}</style></head><body><h1>🤖 Differential Drive Robot</h1><p>Browser-accessible kinematics simulation — no ROS/Gazebo required.</p><canvas id="c" width="900" height="520"></canvas><div class="controls"><button onclick="reset()">Reset</button><button onclick="straight()">Straight</button><button onclick="circle()">Circle</button><button onclick="toggle()">Pause</button></div><p>Arrow keys: drive · 1: straight · 2: circle · 0: keyboard</p><script>
const c=document.getElementById("c"),x=c.getContext("2d");let r={x:450,y:260,t:0,v:0,w:0,mode:"keyboard"},trail=[],run=true,last=performance.now();
function reset(){r={x:450,y:260,t:0,v:0,w:0,mode:"keyboard"};trail=[]}
function straight(){r.mode="straight";r.v=100;r.w=0}
function circle(){r.mode="circle";r.v=80;r.w=.65}
function toggle(){run=!run}
function frame(now){let dt=Math.min((now-last)/1000,.04);last=now;if(run){if(r.mode==="keyboard"){let k={};window._keys&&(k=window._keys);r.v+=(k.ArrowUp?80:-k.ArrowDown?80:0)*dt;r.v*=k.ArrowUp||k.ArrowDown?1:.94;r.w+=(k.ArrowLeft?1.5:-k.ArrowRight?1.5:0)*dt;r.w*=k.ArrowLeft||k.ArrowRight?1:.94}else if(r.mode==="straight"){r.v=100;r.w=0;if(trail.length>250){r.mode="keyboard";r.v=0}}r.x+=r.v*Math.cos(r.t)*dt;r.y+=r.v*Math.sin(r.t)*dt;r.t+=r.w*dt;if(r.x<15||r.x>885){r.x=Math.max(15,Math.min(885,r.x));r.t=Math.PI-r.t}if(r.y<15||r.y>505){r.y=Math.max(15,Math.min(505,r.y));r.t=-r.t}trail.push([r.x,r.y]);if(trail.length>700)trail.shift()}x.clearRect(0,0,900,520);x.strokeStyle="#334155";x.strokeRect(1,1,898,518);x.beginPath();trail.forEach((p,i)=>i?x.lineTo(...p):x.moveTo(...p));x.strokeStyle="#60a5fa";x.stroke();x.save();x.translate(r.x,r.y);x.rotate(r.t);x.fillStyle="#22c55e";x.fillRect(-22,-14,44,28);x.fillStyle="#ef4444";x.fillRect(10,-5,15,10);x.restore();x.fillStyle="#e5e7eb";x.fillText("Mode: "+r.mode+" | v="+r.v.toFixed(1)+" | ω="+r.w.toFixed(2),20,30);requestAnimationFrame(frame)}window._keys={};onkeydown=e=>{window._keys[e.key]=true;if(e.key==="1")straight();if(e.key==="2")circle();if(e.key==="0"){r.mode="keyboard";r.v=0;r.w=0}};onkeyup=e=>window._keys[e.key]=false;requestAnimationFrame(frame);
</script></body></html>
